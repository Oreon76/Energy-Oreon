<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>OREON — mobile full</title>
  <style>
    html, body { margin: 0; background: #15181a; }
    body { width: 390px; }
    iframe { width: 390px; height: 844px; border: 0; display: block; background: #07080a; }
  </style>
</head>
<body>
  <iframe id="frame" src="../index.html" title="Mobile full preview"></iframe>
  <script>
    const frame = document.getElementById("frame");
    frame.addEventListener("load", async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const style = doc.createElement("style");
      style.textContent = ".reveal{opacity:1!important;transform:none!important}";
      doc.head.appendChild(style);
      await new Promise((r) => setTimeout(r, 800));
      frame.style.height = doc.documentElement.scrollHeight + "px";
    });
  </script>
</body>
</html>
