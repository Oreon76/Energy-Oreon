<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>OREON — desktop preview 1440</title>
  <style>
    html, body { margin: 0; background: #15181a; overflow: hidden; }
    .scaler {
      width: 1440px;
      height: 900px;
      transform: scale(0.694);
      transform-origin: top left;
    }
    iframe {
      width: 1440px;
      height: 900px;
      border: 0;
      display: block;
      background: #07080a;
    }
  </style>
</head>
<body>
  <div class="scaler">
    <iframe id="frame" src="../index.html" title="Desktop preview"></iframe>
  </div>
</body>
</html>
