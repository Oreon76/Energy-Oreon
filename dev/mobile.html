<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>OREON — mobile preview</title>
  <style>
    html, body { margin: 0; background: #15181a; }
    body { display: grid; place-items: start center; padding: 0; }
    iframe {
      width: 390px;
      height: 844px;
      border: 0;
      display: block;
      background: #07080a;
    }
  </style>
</head>
<body>
  <iframe id="frame" src="../index.html" title="Mobile preview"></iframe>
  <script>
    const frame = document.getElementById("frame");
    frame.addEventListener("load", () => {
      frame.contentWindow.scrollTo(0, 0);
    });
  </script>
</body>
</html>
